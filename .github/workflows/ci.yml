name: CI/CD (Вариант 7)

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md' # Задание 4: Изменения только в README не запускают пайплайн
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: python:3.12.7-slim
    steps:
      - uses: actions/checkout@v4
      
      - name: Проверка версии Python и коммита
        run: |
          python --version
          echo "Commit: $GITHUB_SHA"

      - name: Компиляция .py файлов
        run: python -m compileall -q .

      - name: Проверка отсутствия .log и .tmp (Вариант 7)
        run: |
          if find . -type f \( -name "*.log" -o -name "*.tmp" \) | grep -q .; then
            echo "Ошибка: В репозитории найдены файлы .log или .tmp"
            exit 1
          else
            echo "Файлы .log и .tmp отсутствуют. OK."
          fi

  test:
    runs-on: ubuntu-latest
    container:
      image: python:3.12.7-slim
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - name: Запуск unit-тестов
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    container:
      image: python:3.12.7-slim
    needs: test
    # Запускается только для main или тегов
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Формирование dist и manifest.txt (Задание 3)
        run: |
          mkdir -p dist
          cp report.py README.md Dockerfile data.json.example dist/ 2>/dev/null || cp report.py README.md data.json.example dist/
          
          cd dist
          ls -1 > file_list.txt
          echo "CI_COMMIT_SHA: $GITHUB_SHA" > manifest.txt
          echo "CI_PIPELINE_ID: $GITHUB_RUN_ID" >> manifest.txt
          echo "--- Файлы ---" >> manifest.txt
          cat file_list.txt >> manifest.txt
          rm file_list.txt
          
          echo "Содержимое манифеста:"
          cat manifest.txt

      - name: Публикация артефакта на 7 дней (Задание 3)
        uses: actions/upload-artifact@v4
        with:
          name: app-package
          path: dist/
          retention-days: 7

  deploy_test:
    runs-on: ubuntu-latest
    container:
      image: python:3.12.7-slim
    needs: package
    if: github.ref == 'refs/heads/main'
    environment: 
      name: test/report
      # В настройках GitHub (Settings -> Environments) создай test/report 
      # и добавь себя в Required reviewers для ручного подтверждения
    steps:
      - uses: actions/checkout@v4
      
      - name: Скачивание артефакта
        uses: actions/download-artifact@v4
        with:
          name: app-package
          path: deploy/test

      - name: Проверка секретов (Задание 4)
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          APP_PORT: ${{ vars.APP_PORT }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then echo "Секрет не задан!"; exit 1; fi
          echo "Секреты и переменные успешно получены (значения скрыты)."
          echo "Порт приложения: $APP_PORT"

      - name: Дымовая проверка (Задание 5)
        run: |
          cd deploy/test
          # Запускаем скрипт с example-данными
          python report.py data.json.example > /tmp/smoke_result.txt
          cat /tmp/smoke_result.txt
          
          if [ $? -eq 0 ]; then
            echo "Дымовая проверка пройдена успешно." > deployment.txt
            echo "Время: $(date)" >> deployment.txt
            cat /tmp/smoke_result.txt >> deployment.txt
          else
            echo "Дымовая проверка ПРОВАЛЕНА." > deployment.txt
            exit 1
          fi

      - name: Сохранение отчета deployment.txt
        uses: actions/upload-artifact@v4
        with:
          name: deployment-report
          path: deploy/test/deployment.txt